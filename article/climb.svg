<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 632" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Held-out boundary score for every round of the cutter climb</title>
<rect width="400" height="632" rx="10" fill="#fafaf8"/>
<text x="20" y="28" font-size="14" font-weight="600" fill="#1c1c1a">Cutter: score on 154 held-out songs</text>
<rect x="20" y="42" width="12" height="10" rx="2" fill="#3f6fc4"/><text x="38" y="51" font-size="12" fill="#55554f">kept</text>
<rect x="78" y="42" width="12" height="10" rx="2" fill="#b5b5ae"/><text x="96" y="51" font-size="12" fill="#55554f">reverted, or a check that could not be adopted</text>
<text x="20" y="80" font-size="13" fill="#1c1c1a">0 · CLAP, 10 s windows every 5 s</text>
<rect x="20" y="86" width="148" height="12" rx="3" fill="#b9c6dc"/>
<text x="176" y="97" font-size="13" fill="#55554f">34.5</text>
<text x="20" y="122" font-size="13" fill="#1c1c1a">1 · Report each cut 2.5 s later</text>
<rect x="20" y="128" width="183" height="12" rx="3" fill="#3f6fc4"/>
<text x="211" y="139" font-size="13" fill="#55554f">42.6</text>
<text x="20" y="164" font-size="13" fill="#6b6b65">2 · Lower the cut threshold (reverted)</text>
<rect x="20" y="170" width="187" height="12" rx="3" fill="#b5b5ae"/>
<text x="215" y="181" font-size="13" fill="#55554f">43.4</text>
<text x="20" y="206" font-size="13" fill="#1c1c1a">3 · Place cuts between grid points</text>
<rect x="20" y="212" width="218" height="12" rx="3" fill="#3f6fc4"/>
<text x="246" y="223" font-size="13" fill="#55554f">50.8</text>
<text x="20" y="248" font-size="13" fill="#6b6b65">4 · Window every 2 s (reverted)</text>
<rect x="20" y="254" width="218" height="12" rx="3" fill="#b5b5ae"/>
<text x="246" y="265" font-size="13" fill="#55554f">50.6</text>
<text x="20" y="290" font-size="13" fill="#6b6b65">5 · One embedding per bar, human bars (check)</text>
<rect x="20" y="296" width="291" height="12" rx="3" fill="#b5b5ae"/>
<text x="319" y="307" font-size="13" fill="#55554f">67.7</text>
<text x="20" y="332" font-size="13" fill="#6b6b65">6 · Bars from a tracker that saw the songs (check)</text>
<rect x="20" y="338" width="293" height="12" rx="3" fill="#b5b5ae"/>
<text x="321" y="349" font-size="13" fill="#55554f">68.2</text>
<text x="20" y="374" font-size="13" fill="#1c1c1a">7 · Bars from a tracker that never saw the song</text>
<rect x="20" y="380" width="292" height="12" rx="3" fill="#3f6fc4"/>
<text x="320" y="391" font-size="13" fill="#55554f">67.9</text>
<text x="20" y="416" font-size="13" fill="#6b6b65">8 · Block matching alone (reverted)</text>
<rect x="20" y="422" width="292" height="12" rx="3" fill="#b5b5ae"/>
<text x="320" y="433" font-size="13" fill="#55554f">67.8</text>
<text x="20" y="458" font-size="13" fill="#1c1c1a">9 · Block matching proposes, change score vetoes</text>
<rect x="20" y="464" width="301" height="12" rx="3" fill="#3f6fc4"/>
<text x="329" y="475" font-size="13" fill="#55554f">70.0</text>
<text x="20" y="500" font-size="13" fill="#1c1c1a">10 · MATPAC++ encoder in place of CLAP</text>
<rect x="20" y="506" width="310" height="12" rx="3" fill="#3f6fc4"/>
<text x="338" y="517" font-size="13" fill="#55554f">72.2</text>
<text x="20" y="542" font-size="13" fill="#6b6b65">11 · Three bars of context per vector (reverted)</text>
<rect x="20" y="548" width="296" height="12" rx="3" fill="#b5b5ae"/>
<text x="324" y="559" font-size="13" fill="#55554f">68.9</text>
<text x="20" y="584" font-size="13" fill="#1c1c1a">12 · Learned filter on the cuts (supervised)</text>
<rect x="20" y="590" width="324" height="12" rx="3" fill="#3f6fc4"/>
<text x="352" y="601" font-size="13" fill="#55554f">75.4</text>
</svg>
